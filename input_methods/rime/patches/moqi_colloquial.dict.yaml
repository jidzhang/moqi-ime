# 高频口语词典补丁（人工小集合；打包期由 rime-prebuild 合入 cn_dicts/）
# 背景：白霜主词典（base/ext/tencent）缺失部分超高频口语词，仅
# cn_dicts_cell/luna 里有权重 0 的残留条目（为音形/辅助链保留），主链上
# 整词权重为 0，输入时输给其他候选——实证 2026-11-08：shima 首选"事吗"，
# "是吗"垫到第 4（用户报障）。
#
# 权重依据：是吗 不能按 2字词频表（734）×2.2=1615 取——挖矿词典里有分词
# 噪声假词条 事吗@1711（subs 语料"啥事吗/有事吗"被错切成"啥/事吗"，真词
# 位被假词占据，jianpin sm 同污染）。故取 2000：反超假词条、仍低于 frost
# 自家真实词 不是吗 2512，不越权。是嘛 稀有（68）保持 150。
# 遗留（发版后词库专场）：bigram 生成器加语气词尾黑名单（吗呢吧啊等，
# 28/1932 条涉及）重生成，根治 事吗/我吗/你吗 类假词条。
# 扩词须先过同判据 + d1/d3/d5 守卫，勿凭手感加。
#
# 变体读音词条（2026-11-11 覆盖审计，见 eval-workspace/readings/variant-audit-2026-11-11.md）：
# 著名两读词（标准音与口语主流在字母层分歧）frost 已双收的照旧（说服/荨麻疹/
# 角色/游说/心宽体胖/关卡/血液/单薄/铁骑/弄堂），此处只补缺口。权重=镜像
# 同词 frost 兄弟条目（frost 自家范式：荨麻疹两读同权重 198）——两读在不同
# 按键上各自竞争，同权重不会互相挤占。依据逐条见审计表。
# 堰塞体 sai=用户实测口语主流（frost 已有），se=现汉标准——补齐标准音；
# 落下风 la=现汉/汉典 + phrase-pinyin-data 主流（frost 只有 luo）。
---
