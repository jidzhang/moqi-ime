# 称呼词库补丁（姓×称谓，人名类丢名补丁，2026-11-26）
# 背景：用户报障“刘工/张工打不出”——全词库无任何“姓+工”条目，
# zhanggong 首选张弓、liugong 首选刘恭（缺位后生俱词占位）。小狼毫同源
# frost 同样缺，等不来上游。
# 范围：常用姓 115（百家姓频率序+高频异读姓）×十个真实后缀
# （工/总/局/处/哥/姐/叔/婅/娤/嫂）。姑/舅/伯/弟/妹/婆/爷/奶
# 这类不加姓的亲属称谓不收（用户“别做过头”）。
# 读音：姓氏异读人工审定（单 shan/解 xie/仇 qiu/查 zha/朴 piao/
# 罯 zhai/盖 ge/区 ou/乐 yue/员 yun/曾 zeng/覃 qin），后缀无异读。
# 权重分档（压生俱不压规范）：
#   工/总/局/处/哥/姐=300：同码 top 多为生俱/人名（张弓:67/刘恭:14/
#   陈宫:170），300 直接 top1；撞规范高频词（理工:2746/例句:2483/网格:2550/
#   章节:8113）时自动让位第 2~3。
#   叔/婅/娤/嫂=500：生活高频，同码多为人名/低频词。
# \u7279\u4f8b\uff1a\u738b\u5de5 400\uff08\u538b\u738b\u5bab 340/\u738b\u516c 282\uff0c\u4e24\u8bcd\u4e66\u9762\u4f4e\u9891\uff09\u3001\u5218\u5c40 500
# \uff08\u538b\u4eba\u540d\u5218\u636e 488\uff09\u3001\u5f20\u5a24 600\uff08\u538b\u4eba\u540d\u5f20\u8bd1 527\uff09\u3001\u6768\u5904 250
# \uff08\u517b\u51fa 298 \u9669\u538b\uff0c\u8ba9\u4f4d\uff09\u3002\u4e0d\u6536\u67e5\u53d4\uff1azhashu \u7801\u4e0a\u6e23\u53d4\uff08name.dict
# @363\uff0c\u8db3\u7403\u9ad8\u9891\u5916\u53f7\uff09\u662f\u771f\u5b9e\u9ad8\u9891\u8bcd\uff0c\u67e5\u59d3\u7a00\u7f55\u3001\u67e5\u53d4\u51e0\u65e0\u8f93\u5165\u573a\u666f\uff0c
# \u52ff\u6dfb\u4e71\uff08B \u8f6e\u5b9e\u6d4b 500 \u6743\u91cd\u538b\u6e23\u53d4\u7ffb\u9519 3 \u53e5\uff0c\u7528\u6237\u62cd\u677f\u5220\uff09\u3002
