# 地名权重提升补丁（2026-11-17）
# 问题：词库里已有省/市/区县地名，但权重低到 1-3，与普通词同码时被压过——
# 实测 chengdu 首选"程度"、luohe 首选"络合"，地级市打不出来。
# 策略（用户 2026-11-17 定调）：超高频常用词（一样/程度 这类 10 万级）
# 压过地级市可以接受，地级市不能输给化学术语/低频词（络合 59）。
#   省级 80000 / 省会·直辖市·特区 40000 / 地级市 2000 / 区县 400。
# 重定档（2026-11-20）：旧档（5万/2万/3千）新压制 1775 个词条、
# 与常用词（词频>=2000）正面相撞 72 对（宜昌>一场、十堰市>实验室、
# 广昌>广场、天镇>天真……引擎实测 8 抽 7 翻首选）。新档恢复 70/72，
# chengdu->成都、luohe->漯河 等 v2.0.7 修复案例全部保留
# （成都 40000 > 程度 25434；漯河 2000 > 络合 59）。
# 只升不降，且只作用于词库已有的词条（不新增）。
